<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Відновлення пароля</title>
</head>
<body style="margin:0; padding:0; background-color:#f7f4f8; font-family: Arial, sans-serif;">

    <table width="100%" cellpadding="0" cellspacing="0" style="background-color:#f7f4f8; padding: 20px;">
        <tr>
            <td align="center">

                <table width="500" cellpadding="0" cellspacing="0" style="background-color:#ffffff; border-radius:12px; padding:0; box-shadow: 0 4px 10px rgba(0,0,0,0.05);">

                    <tr>
                        <td style="background-color:#6fb7b3; height:6px; border-top-left-radius:12px; border-top-right-radius:12px;"></td>
                    </tr>

                    <tr>
                        <td style="padding:30px;" align="center">

                            <h2 style="margin:0; color:#6d4c7d;">Versum</h2>
                            <p style="margin:0; color:#a08aa4; font-size:12px;">Твоя поетична платформа</p>

                            <p style="
                                margin:15px 0 5px;
                                font-size:16px;
                                color:#6fb7b3;
                                font-weight:bold;
                            ">
                                Вітаємо, {UserName}!
                            </p>

                            <h1 style="color:#6d4c7d; margin:20px 0 10px;">Відновлення пароля</h1>

                            <div style="color:#555; font-size:14px; line-height:1.5;">
                                <p>Ми отримали запит на відновлення пароля.</p>
                                <p>Використайте цей код підтвердження:</p>
                            </div>

                            <div style="padding:20px 0;">
                                <div style="
                                    display:inline-block;
                                    padding:15px 25px;
                                    font-size:28px;
                                    letter-spacing:6px;
                                    color:#ffffff;
                                    background-color:#8f6a9c; /* fallback */
                                    background: linear-gradient(90deg, #8f6a9c, #6fb7b3);
                                    border-radius:8px;
                                    font-weight:bold;
                                ">
                                    {RESET_TOKEN}
                                </div>
                            </div>

                            <div style="color:#777; font-size:13px;">
                                <p>Код дійсний протягом 1 години.</p>
                                <p>Якщо Ви не запитували зміну пароля — просто проігноруйте цей лист.</p>
                            </div>

                        </td>
                    </tr>

                </table>

            </td>
        </tr>
    </table>

</body>
</html>
